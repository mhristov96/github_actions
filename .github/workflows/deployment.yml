name: Deploy Project
on:  [push, workflow_dispatch]
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/checkout@v6
            - name: Install NodeJs
              uses: actions/setup-node@v6
              with:
                node-version: '18'
            - name: Install dependecies
              run: npm ci
            - name: Run tests
              run: npm test
    deploy:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - name: Get code
          uses: actions/checkout@v6
        - name: Install NodeJs
          uses: actions/setup-node@v6
          with:
            node-version: '18'
        - name: Install dependecies
          run: npm ci
        - name: Build Project
          run: npm run build
        - name: Deploy
          run: echo "Deploying..."



